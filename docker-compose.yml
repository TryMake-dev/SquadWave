version: "3.8"

services:
  sfu-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: squad-sfu
    restart: always
    ports:
      - "8443:8443"
      - "50000-50100:50000-50100/udp"
    environment:
      - OPUS_BITRATE=128000
      - STUN_SERVER=stun:stun.l.google.com:19302
    networks:
      - squad-net

  coturn:
    image: coturn/coturn:latest
    container_name: squad-turn
    restart: always
    ports:
      - "3478:3478"
      - "3478:3478/udp"
    environment:
      - TURN_USERNAME=squad
      - TURN_PASSWORD=webrtc2026
      - TURN_REALM=squad-voice.internal
    networks:
      - squad-net

networks:
  squad-net:
    driver: bridge
