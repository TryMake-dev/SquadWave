version: "3.8"

services:
  squadwave:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: squadwave-app
    restart: always
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
    volumes:
      - ./server/squadwave.db:/app/server/squadwave.db
    networks:
      - squad-net

  coturn:
    image: coturn/coturn:latest
    container_name: squadwave-coturn
    restart: always
    ports:
      - "3478:3478"
      - "3478:3478/udp"
    environment:
      - TURN_USERNAME=squad
      - TURN_PASSWORD=webrtc2026
      - TURN_REALM=squad-voice.internal
    networks:
      - squad-net

networks:
  squad-net:
    driver: bridge
