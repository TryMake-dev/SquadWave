version: "3.8"

services:
  sfu-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: squadwave-sfu
    restart: always
    ports:
      - "8443:8443"
      - "50000-50100:50000-50100/udp"
    environment:
      - OPUS_BITRATE=128000
      - STUN_SERVER=stun:stun.l.google.com:19302
    networks:
      - squad-net

  coturn:
    image: coturn/coturn:latest
    container_name: squadwave-turn
    restart: always
    ports:
      - "3478:3478"
      - "3478:3478/udp"
    environment:
      - TURN_USERNAME=squad
      - TURN_PASSWORD=webrtc2026
      - TURN_REALM=squad-voice.internal
    networks:
      - squad-net

  web-client:
    image: nginx:alpine
    container_name: squadwave-web
    restart: always
    ports:
      - "3000:80"
    volumes:
      - ./web/dist:/usr/share/nginx/html:ro
    networks:
      - squad-net

networks:
  squad-net:
    driver: bridge
